<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 20 896 476" width="100%" height="100%" fill="none" class="cluster-diagram">
  <defs>
    <style>
      .bg-canvas { fill: #0e1218; stroke: rgba(255, 255, 255, 0.1); }
      .bg-card { fill: #11151c; stroke: rgba(255, 255, 255, 0.12); }
      .bg-header { fill: #171d26; }
      .bg-inner { fill: #0b0d11; stroke: rgba(255, 255, 255, 0.08); }
      .bg-highlight { fill: #0b0d11; stroke: #14b8a6; }
      .txt-primary { fill: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
      .txt-secondary { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
      .txt-muted { fill: #8896ab; font-family: "JetBrains Mono", "IBM Plex Mono", monospace; }
      .txt-teal { fill: #14b8a6; font-family: "JetBrains Mono", "IBM Plex Mono", monospace; font-weight: 600; }
      .txt-green { fill: #10b981; font-family: "JetBrains Mono", "IBM Plex Mono", monospace; font-weight: 600; }
      .badge-bg { fill: rgba(20, 184, 166, 0.12); stroke: #14b8a6; }
      .line-divider { stroke: rgba(255, 255, 255, 0.08); }
      @media (prefers-color-scheme: light) {
        .bg-canvas { fill: #f8fafc; stroke: rgba(0, 0, 0, 0.1); }
        .bg-card { fill: #ffffff; stroke: rgba(0, 0, 0, 0.12); }
        .bg-header { fill: #f8fafc; }
        .bg-inner { fill: #f1f5f9; stroke: rgba(0, 0, 0, 0.08); }
        .bg-highlight { fill: #f0fdfa; stroke: #0d9488; }
        .txt-primary { fill: #0f172a; }
        .txt-secondary { fill: #475569; }
        .txt-muted { fill: #64748b; }
        .txt-teal { fill: #0d9488; }
        .txt-green { fill: #059669; }
        .badge-bg { fill: rgba(13, 148, 136, 0.08); stroke: #0d9488; }
        .line-divider { stroke: rgba(0, 0, 0, 0.08); }
      }
    </style>
    <filter id="box-shadow" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas (for standalone viewing) -->
  <rect x="32" y="20" width="896" height="476" rx="8" class="bg-canvas"/>

  <!-- Top Ribbon / Network Legend -->
  <g transform="translate(32, 28)">
    <text x="0" y="14" class="txt-primary" font-size="14" font-weight="600" letter-spacing="0.05em">SOVEREIGN ARCHITECTURE TOPOLOGY</text>
    <text x="0" y="32" class="txt-muted" font-size="11">PRIVATE INFRASTRUCTURE · ENCRYPTED LOCAL FABRIC · HIGH AVAILABILITY</text>
    <rect x="750" y="2" width="146" height="26" rx="4" class="badge-bg" stroke-width="1"/>
    <circle cx="766" cy="15" r="4" fill="#10b981"/>
    <text x="778" y="19" class="txt-teal" font-size="11">HA CLUSTER</text>
  </g>

  <!-- Node B: AI Workhorse Hypervisor -->
  <g transform="translate(32, 80)">
    <rect width="424" height="280" rx="8" class="bg-card" stroke-width="1" filter="url(#box-shadow)"/>
    
    <!-- Node Header -->
    <path d="M 0 8 Q 0 0 8 0 L 416 0 Q 424 0 424 8 L 424 38 L 0 38 Z" class="bg-header"/>
    <rect x="14" y="12" width="10" height="14" rx="2" fill="#14b8a6"/>
    <text x="32" y="24" class="txt-primary" font-size="13" font-weight="600">NODE B · Compute &amp; Storage Plane</text>
    <text x="335" y="24" class="txt-muted" font-size="11">node B</text>
    <line x1="0" y1="38" x2="424" y2="38" class="line-divider"/>

    <!-- Containers inside NODE B -->
    <!-- inference -->
    <g transform="translate(16, 50)">
      <rect width="188" height="96" rx="6" class="bg-highlight" stroke-width="1.5"/>
      <text x="12" y="22" class="txt-teal" font-size="11">INFERENCE RUNTIME</text>
      <text x="12" y="42" class="txt-primary" font-size="12" font-weight="500">ik_llama.cpp Engine</text>
      <text x="12" y="60" class="txt-secondary" font-size="11">Four-Model CPU Fleet</text>
      <text x="12" y="78" class="txt-muted" font-size="10">Flash Attention · Pinned Threads</text>
    </g>

    <!-- ingestion and search -->
    <g transform="translate(220, 50)">
      <rect width="188" height="96" rx="6" class="bg-inner"/>
      <text x="12" y="22" class="txt-muted" font-size="11" font-weight="600">INGESTION &amp; SEARCH</text>
      <text x="12" y="42" class="txt-primary" font-size="12" font-weight="500">Pipeline Automation</text>
      <text x="12" y="60" class="txt-secondary" font-size="11">n8n · Paperless-ngx</text>
      <text x="12" y="78" class="txt-muted" font-size="10">SearXNG · Isolated Storage</text>
    </g>

    <!-- agent runtime -->
    <g transform="translate(16, 160)">
      <rect width="188" height="96" rx="6" class="bg-inner"/>
      <text x="12" y="22" class="txt-muted" font-size="11" font-weight="600">AUTONOMOUS OPERATOR</text>
      <text x="12" y="42" class="txt-primary" font-size="12" font-weight="500">Hermes Sovereign Agent</text>
      <text x="12" y="60" class="txt-secondary" font-size="11">MCP Protocol · Supervised</text>
      <text x="12" y="78" class="txt-muted" font-size="10">Telemetry Ingest · Gated Gates</text>
    </g>

    <!-- backup and storage authority -->
    <g transform="translate(220, 160)">
      <rect width="188" height="96" rx="6" class="bg-inner"/>
      <text x="12" y="22" class="txt-muted" font-size="11" font-weight="600">STORAGE AUTHORITY</text>
      <text x="12" y="42" class="txt-primary" font-size="12" font-weight="500">Proxmox Backup Server</text>
      <text x="12" y="60" class="txt-secondary" font-size="11">Deduplicated Datastore</text>
      <text x="12" y="78" class="txt-muted" font-size="10">Verified Daily Snapshots</text>
    </g>
  </g>

  <!-- Node A: Proxmox Master & Control Plane -->
  <g transform="translate(480, 80)">
    <rect width="448" height="280" rx="8" class="bg-card" stroke-width="1" filter="url(#box-shadow)"/>
    
    <!-- Node Header -->
    <path d="M 0 8 Q 0 0 8 0 L 440 0 Q 448 0 448 8 L 448 38 L 0 38 Z" class="bg-header"/>
    <rect x="14" y="12" width="10" height="14" rx="2" fill="#14b8a6"/>
    <text x="32" y="24" class="txt-primary" font-size="13" font-weight="600">NODE A · Control Plane &amp; Gateway</text>
    <text x="365" y="24" class="txt-muted" font-size="11">node A</text>
    <line x1="0" y1="38" x2="448" y2="38" class="line-divider"/>

    <!-- Containers inside NODE A -->
    <!-- cluster master -->
    <g transform="translate(16, 50)">
      <rect width="200" height="96" rx="6" class="bg-inner"/>
      <text x="12" y="22" class="txt-muted" font-size="11" font-weight="600">CLUSTER MASTER</text>
      <text x="12" y="42" class="txt-primary" font-size="12" font-weight="500">Proxmox VE Controller</text>
      <text x="12" y="60" class="txt-secondary" font-size="11">Corosync State Sync</text>
      <text x="12" y="78" class="txt-muted" font-size="10">High-Availability Engine</text>
    </g>

    <!-- ingress and mesh -->
    <g transform="translate(232, 50)">
      <rect width="200" height="96" rx="6" class="bg-inner"/>
      <text x="12" y="22" class="txt-muted" font-size="11" font-weight="600">SERVICE INGRESS</text>
      <text x="12" y="42" class="txt-primary" font-size="12" font-weight="500">Internal Gateway &amp; Proxy</text>
      <text x="12" y="60" class="txt-secondary" font-size="11">Authenticated Core Ingress</text>
      <text x="12" y="78" class="txt-muted" font-size="10">Automatic TLS &amp; Route Mesh</text>
    </g>

    <!-- zero trust fabric -->
    <g transform="translate(16, 160)">
      <rect width="200" height="96" rx="6" class="bg-inner"/>
      <text x="12" y="22" class="txt-muted" font-size="11" font-weight="600">ZERO-TRUST FABRIC</text>
      <text x="12" y="42" class="txt-primary" font-size="12" font-weight="500">Encrypted Transport Mesh</text>
      <text x="12" y="60" class="txt-secondary" font-size="11">WireGuard · Tailscale</text>
      <text x="12" y="78" class="txt-muted" font-size="10">Peer-to-Peer Zero-Trust</text>
    </g>

    <!-- engineering execution sandbox -->
    <g transform="translate(232, 160)">
      <rect width="200" height="96" rx="6" class="bg-inner"/>
      <text x="12" y="22" class="txt-muted" font-size="11" font-weight="600">ENGINEERING SANDBOX</text>
      <text x="12" y="42" class="txt-primary" font-size="12" font-weight="500">Isolated KVM Environment</text>
      <text x="12" y="60" class="txt-secondary" font-size="11">Candidate Benchmarking</text>
      <text x="12" y="78" class="txt-muted" font-size="10">Dedicated Hardware Bounds</text>
    </g>
  </g>

  <!-- External Tie-Breaker (Corosync QDevice) & Gateway -->
  <g transform="translate(32, 384)">
    <!-- OPNsense Gateway -->
    <rect x="0" y="0" width="280" height="104" rx="8" class="bg-card"/>
    <text x="16" y="26" class="txt-primary" font-size="13" font-weight="600">Perimeter Gateway / Firewall</text>
    <text x="16" y="46" class="txt-secondary" font-size="11">OPNsense Core Routing</text>
    <text x="16" y="68" class="txt-muted" font-size="11">Segmented VLANs · WireGuard Mesh</text>
    <text x="16" y="88" class="txt-teal" font-size="10">Strict Access Control Lists</text>

    <!-- Corosync External Quorum Witness (VPS) -->
    <rect x="300" y="0" width="344" height="104" rx="8" class="bg-highlight" stroke-width="1.5"/>
    <text x="316" y="26" class="txt-teal" font-size="13">External Quorum Witness (QDevice)</text>
    <text x="316" y="46" class="txt-primary" font-size="11" font-weight="600">Off-site Cloud Witness (VPS)</text>
    <text x="316" y="68" class="txt-secondary" font-size="11">Independent Failure Domain · 3rd Vote</text>
    <text x="316" y="88" class="txt-green" font-size="10">Zero Split-Brain on Hypervisor Reboot</text>

    <!-- Cloudflare Edge Box -->
    <rect x="664" y="0" width="232" height="104" rx="8" class="bg-card"/>
    <text x="680" y="26" class="txt-primary" font-size="13" font-weight="600">Edge Security &amp; Origin</text>
    <text x="680" y="46" class="txt-secondary" font-size="11">Cloudflare Anycast · TLS 1.3</text>
    <text x="680" y="68" class="txt-muted" font-size="11">Caddy HTTP/3 Origin Server</text>
    <text x="680" y="88" class="txt-teal" font-size="10">Origin Auth · DDoS Defense</text>
  </g>
</svg>
