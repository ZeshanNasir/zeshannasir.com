<svg xmlns="http://www.w3.org/2000/svg" viewBox="32 18 896 338" width="100%" height="100%" fill="none" class="pipeline-diagram">
  <defs>
    <style>
      .bg-canvas { fill: #0e1218; stroke: rgba(255, 255, 255, 0.1); }
      .bg-card { fill: #11151c; stroke: rgba(255, 255, 255, 0.12); }
      .bg-inner { fill: #0b0d11; stroke: rgba(255, 255, 255, 0.08); }
      .txt-primary { fill: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
      .txt-secondary { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif; }
      .txt-muted { fill: #8896ab; font-family: "JetBrains Mono", "IBM Plex Mono", monospace; }
      .txt-teal { fill: #14b8a6; font-family: "JetBrains Mono", "IBM Plex Mono", monospace; font-weight: 600; }
      .txt-green { fill: #10b981; font-family: "JetBrains Mono", "IBM Plex Mono", monospace; font-weight: 600; }
      .txt-amber { fill: #f59e0b; font-family: "JetBrains Mono", "IBM Plex Mono", monospace; font-weight: 600; }
      @media (prefers-color-scheme: light) {
        .bg-canvas { fill: #f8fafc; stroke: rgba(0, 0, 0, 0.1); }
        .bg-card { fill: #ffffff; stroke: rgba(0, 0, 0, 0.12); }
        .bg-inner { fill: #f1f5f9; stroke: rgba(0, 0, 0, 0.08); }
        .txt-primary { fill: #0f172a; }
        .txt-secondary { fill: #475569; }
        .txt-muted { fill: #64748b; }
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#14b8a6"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background Canvas (for standalone viewing) -->
  <rect x="32" y="18" width="896" height="338" rx="8" class="bg-canvas"/>

  <!-- Title -->
  <g transform="translate(32, 28)">
    <text x="0" y="14" class="txt-primary" font-size="14" font-weight="600" letter-spacing="0.05em">KNOWLEDGE LIFECYCLE GOVERNANCE PIPELINE</text>
    <text x="0" y="32" class="txt-muted" font-size="11">KNOWLEDGE WORKSPACE ➔ AUTOMATION ENGINE ➔ GROUND-TRUTH RAG VALIDATION</text>
  </g>

  <!-- Step 1: Enterprise Spaces -->
  <g transform="translate(32, 85)">
    <rect width="190" height="150" rx="8" class="bg-card"/>
    <text x="16" y="28" class="txt-teal" font-size="11">STAGE 01</text>
    <text x="16" y="52" class="txt-primary" font-size="14" font-weight="600">Enterprise Corpus</text>
    <text x="16" y="74" class="txt-secondary" font-size="11">Corporate Knowledge Spaces</text>
    <text x="16" y="96" class="txt-muted" font-size="10">Metadata Schema:</text>
    <text x="16" y="112" class="txt-muted" font-size="10">• Owner UUID</text>
    <text x="16" y="128" class="txt-muted" font-size="10">• Cadence (90-365d)</text>
  </g>

  <!-- Flow Line 1 to 2 -->
  <line x1="222" y1="160" x2="260" y2="160" stroke="#14b8a6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 2: Automated Sweeper -->
  <g transform="translate(268, 85)">
    <rect width="200" height="150" rx="8" class="bg-card"/>
    <text x="16" y="28" class="txt-teal" font-size="11">STAGE 02</text>
    <text x="16" y="52" class="txt-primary" font-size="14" font-weight="600">Automated Audit</text>
    <text x="16" y="74" class="txt-secondary" font-size="11">Automated Cron &amp; Webhooks</text>
    <text x="16" y="96" class="txt-muted" font-size="10">Validation Sweep:</text>
    <text x="16" y="112" class="txt-muted" font-size="10">• Missing frontmatter</text>
    <text x="16" y="128" class="txt-muted" font-size="10">• Elapsed review date</text>
  </g>

  <!-- Flow Line 2 to 3 -->
  <line x1="468" y1="160" x2="506" y2="160" stroke="#14b8a6" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Step 3: Branch Decision (Verified vs Stale) -->
  <g transform="translate(514, 85)">
    <rect width="190" height="150" rx="8" class="bg-card"/>
    <text x="16" y="28" class="txt-teal" font-size="11">STAGE 03</text>
    <text x="16" y="52" class="txt-primary" font-size="14" font-weight="600">Lifecycle Branch</text>
    <text x="16" y="74" class="txt-secondary" font-size="11">Owner Review Loop</text>
    <text x="16" y="100" class="txt-green" font-size="11">✓ Verified Current</text>
    <text x="16" y="124" class="txt-amber" font-size="11">⚠ Stale / Expired</text>
  </g>

  <!-- Path A: Verified Current -> RAG Ground Truth -->
  <path d="M 704 125 L 748 125" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

  <g transform="translate(756, 60)">
    <rect width="172" height="100" rx="8" class="bg-inner" stroke="#10b981" stroke-width="1.5"/>
    <text x="14" y="24" class="txt-green" font-size="10">VERIFIED REPOSITORY</text>
    <text x="14" y="46" class="txt-primary" font-size="13" font-weight="600">RAG Ground Truth</text>
    <text x="14" y="68" class="txt-secondary" font-size="11">Enterprise Search &amp; RAG</text>
    <text x="14" y="86" class="txt-teal" font-size="10">Zero-Hallucination Scope</text>
  </g>

  <!-- Path B: Stale -> Deprecation Pipeline -->
  <path d="M 704 185 L 748 185" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <g transform="translate(756, 175)">
    <rect width="172" height="100" rx="8" class="bg-inner" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="14" y="24" class="txt-amber" font-size="10">TICKET AUTO-ESCALATION</text>
    <text x="14" y="46" class="txt-primary" font-size="13" font-weight="600">Prune &amp; Quarantine</text>
    <text x="14" y="68" class="txt-secondary" font-size="11">Moved to Archive Space</text>
    <text x="14" y="86" class="txt-muted" font-size="10">Tagged: NOINDEX</text>
  </g>

  <!-- Bottom Metric Banner -->
  <g transform="translate(32, 295)">
    <rect width="896" height="55" rx="6" class="bg-inner"/>
    <text x="24" y="32" class="txt-muted" font-size="11">INVARIANT:</text>
    <text x="100" y="32" class="txt-primary" font-size="11" font-weight="600">Every indexed page has an owner and a review date</text>
    <text x="872" y="32" text-anchor="end" class="txt-teal" font-size="11" font-weight="600">Failing pages leave the index, not the internet</text>
  </g>
</svg>
